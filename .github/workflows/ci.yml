name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt, vet, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: go build -trimpath -o bin/ ./cmd/...

  ids:
    name: IDS (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r ids/requirements-dev.txt

      - name: pytest
        working-directory: ids
        run: python -m pytest -q

      - name: Train the lab model on the committed dataset
        working-directory: ids
        run: python -m sdp_ids.train --data data/lab-windows.csv --out /tmp/model.joblib

  lint:
    name: Shell and Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          shellcheck scripts/demo.sh scripts/gen-env.sh scripts/bench/run.sh scripts/ids/record-dataset.sh
          shellcheck -s sh lab/pki-bootstrap.sh

      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet

  e2e:
    name: End-to-end lab
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lab secrets
        run: ./scripts/gen-env.sh

      - name: Build and start the lab (proposed mode)
        run: docker compose up -d --build --wait

      - name: Demo (quick)
        run: ./scripts/demo.sh --quick

      - name: Demo on a recreated lab (fresh PKI and Keycloak)
        run: |
          docker compose down -v
          docker compose up -d --wait
          ./scripts/demo.sh --quick

      - name: Demo in traditional mode
        run: |
          docker compose down
          SDP_MODE=traditional COMPOSE_PROFILES= docker compose up -d --wait
          SDP_MODE=traditional COMPOSE_PROFILES= ./scripts/demo.sh --quick

      - name: Benchmark (quick, topologies 1 and 2, informative)
        run: ./scripts/bench/run.sh --quick --topologies 1,2

      - name: Logs
        if: failure()
        run: COMPOSE_PROFILES=proposed,bench docker compose logs --no-color

      - name: Tear down
        if: always()
        run: COMPOSE_PROFILES=proposed,bench docker compose down -v
